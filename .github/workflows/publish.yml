name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Inspect distribution contents
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          required = {
              "anymaterial/__init__.py",
              "anymaterial/__main__.py",
              "anymaterial/data/dnv_rp_c208.json",
              "anymaterial/data/materials.json",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = set(archive.namelist())
          missing = required - wheel_names
          assert not missing, f"wheel is missing: {sorted(missing)}"
          assert any(name.endswith(".dist-info/entry_points.txt") for name in wheel_names)
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in wheel_names)

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = archive.getnames()
          for suffix in (
              "/LICENSE",
              "/README.md",
              "/CHANGELOG.md",
              "/ECOSYSTEM_GUIDE.md",
              "/RELEASING.md",
              "/tests/test_packaging.py",
              "/src/anymaterial/data/dnv_rp_c208.json",
              "/src/anymaterial/data/materials.json",
          ):
              assert any(name.endswith(suffix) for name in sdist_names), suffix
      - name: Generate release checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test the installed package
        working-directory: /tmp
        run: |
          python -c "import anymaterial; assert anymaterial.__version__ == '0.1.1'"
          python -c "import anymaterial.gui; assert callable(anymaterial.gui.main)"
          python -c "from importlib.resources import files; import anymaterial as am; assert len(am.library().names) == 33; assert files('anymaterial').joinpath('data/materials.json').is_file(); assert files('anymaterial').joinpath('data/dnv_rp_c208.json').is_file()"
          anymaterial --help >/dev/null
          anymaterial --json library >/dev/null

  testpypi:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ANYmaterial
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: >-
      github.event_name == 'release' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ANYmaterial
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the ledger-only release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download the complete prebuilt release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Verify sole-child ledger authority and exact distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/verify_release_authority.py \
            --ledger docs/release/anymaterial-0.1.1-ledger.json \
            --assets release-assets \
            --output dist \
            --tag "$RELEASE_TAG" \
            --protected-ref refs/remotes/origin/main \
            --expected-terminal ACCEPTED_ANYMATERIAL_0_1_1_RELEASE \
            --distribution ANYmaterial \
            --version 0.1.1 \
            --artifact anymaterial-0.1.1-py3-none-any.whl \
            --artifact anymaterial-0.1.1.tar.gz
      - name: Publish exact ledger-authorized distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
