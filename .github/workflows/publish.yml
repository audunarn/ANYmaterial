name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version (expected v$package_version)."
            exit 1
          fi
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Inspect distribution contents
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          required = {
              "anymaterial/__init__.py",
              "anymaterial/__main__.py",
              "anymaterial/data/dnv_rp_c208.json",
              "anymaterial/data/materials.json",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = set(archive.namelist())
          missing = required - wheel_names
          assert not missing, f"wheel is missing: {sorted(missing)}"
          assert any(name.endswith(".dist-info/entry_points.txt") for name in wheel_names)
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in wheel_names)

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = archive.getnames()
          for suffix in (
              "/LICENSE",
              "/README.md",
              "/CHANGELOG.md",
              "/ECOSYSTEM_GUIDE.md",
              "/RELEASING.md",
              "/tests/test_packaging.py",
              "/src/anymaterial/data/dnv_rp_c208.json",
              "/src/anymaterial/data/materials.json",
          ):
              assert any(name.endswith(suffix) for name in sdist_names), suffix
      - name: Generate release checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test the installed package
        working-directory: /tmp
        run: |
          python -c "import anymaterial; assert anymaterial.__version__ == '0.1.1'"
          python -c "import anymaterial.gui; assert callable(anymaterial.gui.main)"
          python -c "from importlib.resources import files; import anymaterial as am; assert len(am.library().names) == 33; assert files('anymaterial').joinpath('data/materials.json').is_file(); assert files('anymaterial').joinpath('data/dnv_rp_c208.json').is_file()"
          anymaterial --help >/dev/null
          anymaterial --json library >/dev/null

  testpypi:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ANYmaterial
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: >-
      github.event_name == 'release' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ANYmaterial
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download prebuilt release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download '${{ github.event.release.tag_name }}' --repo '${{ github.repository }}' --dir release --pattern '*.whl' --pattern '*.tar.gz' --pattern 'SHA256SUMS'
      - name: Verify exact release artifact set and hashes
        shell: python
        run: |
          import hashlib
          import re
          from pathlib import Path
          root = Path("release")
          artifacts = sorted(path for path in root.iterdir() if path.name != "SHA256SUMS")
          assert len(artifacts) == 2
          assert sum(path.suffix == ".whl" for path in artifacts) == 1
          assert sum(path.name.endswith(".tar.gz") for path in artifacts) == 1
          entries = {}
          for line in (root / "SHA256SUMS").read_text(encoding="ascii").splitlines():
              match = re.fullmatch(r"([0-9a-fA-F]{64})  ([^/\\]+)", line)
              assert match is not None and match.group(2) not in entries
              entries[match.group(2)] = match.group(1).lower()
          assert set(entries) == {path.name for path in artifacts}
          for path in artifacts:
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entries[path.name]
          Path("dist").mkdir()
          for path in artifacts:
              Path("dist", path.name).write_bytes(path.read_bytes())
      - uses: pypa/gh-action-pypi-publish@release/v1
