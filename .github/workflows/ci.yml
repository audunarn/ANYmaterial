name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import anymaterial; print(anymaterial.__version__)"
      - name: Run tests
        env:
          # Linux runners have no display. Windows CI exercises the real Tk
          # widgets; ordinary local runs remain window-free unless opted in.
          ANYMATERIAL_RUN_GUI_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -m pytest

  # A wheel built from a clean checkout, installed on its own, importing
  # without the repository on sys.path.  Catches the packaging mistakes that
  # an editable install hides: a data file left out of MANIFEST.in, a
  # subpackage missing from the find directive.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cd /tmp && python -c "import anymaterial; print(anymaterial.__version__)"
