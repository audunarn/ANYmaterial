[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYmaterial"
version = "0.2.0"
description = "Structural material models: isotropic and orthotropic elasticity, nonlinear hardening curves"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "docs/LICENSE.md",
  "src/anymaterial/data/LICENSE_DATA.md",
  "src/anymaterial/data/SOURCES.md",
]
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# The material editor uses tkinter from the standard library, so it adds no
# wheel.  The extra exists so `pip install ANYmaterial[gui]` is meaningful and
# stays meaningful if that ever stops being true.
gui = []
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]

[project.scripts]
anymaterial = "anymaterial.__main__:main"

# A GUI entry point so no console window opens alongside the editor.
[project.gui-scripts]
anymaterial-gui = "anymaterial.gui:main"

[project.urls]
Homepage = "https://github.com/audunarn/ANYmaterial"
Repository = "https://github.com/audunarn/ANYmaterial"
Issues = "https://github.com/audunarn/ANYmaterial/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anymaterial*"]

[tool.setuptools.package-data]
anymaterial = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
# tests/conftest.py assigns a unique, gitignored repository-local basetemp so
# concurrent runs never fight over one Windows directory.
addopts = ["-ra", "-p", "no:cacheprovider"]
